<!DOCTYPE html>
<div th:fragment="graphView(graph)" class="edrops-graph-container">
    <div th:if="${diagram != null}">
        <div th:if="${diagram.error != null}" class="alert alert-danger" th:text="${diagram.error}">
            Feil ved generering av graf.
        </div>

        <svg th:if="${diagram.error == null}"
             th:attr="viewBox=|0 0 ${diagram.area.width} ${diagram.area.height}|"
             th:style="|aspect-ratio: ${diagram.area.width} / ${diagram.area.height};|"
             xmlns="http://www.w3.org/2000/svg"
             class="edrops-graph-svg">

            <g class="graph-header">
                <text x="20" y="25" class="title-text"
                    th:style="|font-size: ${diagram.fontScale}px;|">
                    <tspan th:text="#{yTitle}"></tspan>
                    <tspan>:</tspan>
                    <tspan th:text="${graphForm.yUnit}" dx="4"></tspan>
                    <tspan th:text="#{xTitle}" dx="20"></tspan>
                    <tspan>:</tspan>
                    <tspan th:text="${graphForm.xUnit}" dx="4"></tspan>
                </text>
            </g>

            <defs>
                <clipPath id="cutGraph">
                    <use href="#plot-area" fill="none" />
                </clipPath>
            </defs>

            <rect class="plot-area" id="plot-area"
                  th:x="${diagram.area.plotAnchorX}"
                  th:y="${diagram.area.plotAnchorY}"
                  th:width="${diagram.area.plotWidth}"
                  th:height="${diagram.area.plotHeight}"
                  fill="#ffffff"
                  stroke="#cbd5e1"
                  stroke-width="1"/>

            <g class="data-series" clip-path="url(#cutGraph)">
                <polyline th:each="s : ${polylines}"
                          th:points="${s}"
                          fill="none"
                          stroke="#2563eb"
                          stroke-width="2.5"/>
            </g>

            <g th:each="axis : ${diagram.axes}" class="axis">
                <line class="axis-line"
                      th:x1="${axis.mainLine.x1}"
                      th:y1="${axis.mainLine.y1}"
                      th:x2="${axis.mainLine.x2}"
                      th:y2="${axis.mainLine.y2}"/>

                <g th:each="sub : ${axis.subTicks}" class="sub-tick">
                    <line class="sub-tick-line"
                          th:x1="${sub.tickLine.x1}"
                          th:y1="${sub.tickLine.y1}"
                          th:x2="${sub.tickLine.x2}"
                          th:y2="${sub.tickLine.y2}"/>
                </g>

                <g th:each="tick : ${axis.ticks}" class="tick">
                    <line class="tick-line"
                          th:x1="${tick.tickLine.x1}"
                          th:y1="${tick.tickLine.y1}"
                          th:x2="${tick.tickLine.x2}"
                          th:y2="${tick.tickLine.y2}"/>

                    <text th:if="${tick.labelPoint != null and tick.label != null}"
                          class="tick-text"
                          th:style="|font-size: ${diagram.fontScale}px;|"
                          dominant-baseline="central"
                          dy="-0.35em"
                          th:x="${tick.labelPoint.x}"
                          th:y="${tick.labelPoint.y}"
                          th:attr="text-anchor=${tick.textAlignment.name() == 'CENTER' ? 'middle' : (tick.textAlignment.name() == 'END' ? 'end' : 'start')}"
                          th:text="${tick.label}">
                    </text>
                </g>




                <g class="grid-lines">
                    <line th:each="line : ${axis.gridLines}"
                          th:x1="${line.x1}" th:y1="${line.y1}"
                          th:x2="${line.x2}" th:y2="${line.y2}"
                          stroke="#e2e8f0"
                          stroke-width="1"/>
                </g>
            </g>
        </svg>
    </div>
</div>
