<div th:fragment="operatorHelp">
    <div id="operator-help-container" class="operator-help-container" style="display: none; ">
        <div th:text="#{calchelp.operators} + ': ' + ${operatorText}"></div>
        <div th:text="#{calchelp.functions} + ': ' + ${funcText}"></div>
        <div th:text="#{calchelp.constants} + ': ' + ${constText}"></div>
        <div th:text="#{calchelp.parenthesis} + ': ' + ${parenthesisText}"></div>
        <div th:text="#{calchelp.variables} + ': ' + ${varText}"></div>
    </div>
</div>
