<!DOCTYPE HTML>
<html lang="en" th:lang="${langCode}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{template.html}">
<head>
    <title>Graph</title>
    <script th:src="@{/js/operatorhelp.js(v=${built})}"></script>
    <script th:src="@{/js/expr.js(v=${built})}"></script>
</head>
<body>
<div layout:fragment="content">
    <h1 th:text="${doc.subject != null} ? ${doc.subject} : #{${doc.segment}}"></h1>
    <form th:action="@{/calc}" th:object="${calcForm}" th:method="post">
        <div class="input-form">
            <div class="input-row">
                <label for="expr" id="exprLabel" th:text="#{calcTemplate}"></label>
                <select id="expr" th:field="*{expr}" onchange="loadexpr(this)">
                    <option th:each="expr : ${exprs}"
                            th:value="${expr.subject}"
                            th:text="${expr.subject}"
                            th:attr="data-expr=${expr.expr}">>
                    </option>
                </select>
            </div>
            <div class="input-row full-width">
                <label th:for="calcInput" th:text="#{calcInput}"></label>
                <textarea spellcheck="false" autocorrect=off autocapitalize="off" class="calcInput"
                          id="calcInput" th:field="*{calcInput}"></textarea>
            </div>
        </div>
        <div th:if="${#fields.hasGlobalErrors()}">
            <p class="error" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>
        <div th:if="${errorText != null}">
            <p class="error" th:text="${errorText}"></p>
        </div>
        <button type="submit" th:text="#{action.calculate}"></button>
        <button type="button" onclick="clearCalc()" th:text="#{clear}"></button>
        <button type="button" th:text="#{action.help}" onclick="toggleOperatorHelp()"></button>
        <table id="calcResult" th:if="${vars != null and !vars.isEmpty()}">
            <tbody>
            <tr th:each="var : ${vars}">
                <td th:text="|${var.key.abbrev} = ${var.value}|"></td>
            </tr>
            </tbody>
        </table>
    </form>
    <div th:insert="~{operatorHelp :: operatorHelp}"></div>
    <!--div th:insert="~{graphView :: graphView(${graph})}"></div-->
    <details id="calc-details" open>
        <summary th:text="#{details}"></summary>
        <div class="container" th:utext="${docText}"></div>
        <br>
    </details>
</div>
</body>
</html>
